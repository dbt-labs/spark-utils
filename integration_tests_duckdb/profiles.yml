spark_utils_duckdb_parse:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: ./target/parse.duckdb
      threads: 1

    databricks:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      token: "{{ env_var('DBT_ENV_SECRET_DATABRICKS_TOKEN') }}"
      schema: spark_utils_ci_debug
      threads: 1
