# **what?**
# Run tests for spark-utils against supported adapters

# **why?**
# To ensure that spark-utils works as expected with all supported adapters

# **when?**
# On every PR, and every push to main and when manually triggered

name: Package Integration Tests

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:


jobs:
  run-tests:
      runs-on: ubuntu-latest
      steps:
        # Placeholder: replace with a call to the shared package-testing workflow
        # (as dbt-utils does) once the trivial version is confirmed working.
        - name: Hello from CI
          run: echo "spark-utils CI is running"

  parse-duckdb:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
              python-version: "3.11"

        - name: Install dbt and DuckDB
          run: pip install "dbt>=2.0.0,<3.0.0"

        - name: Check the DuckDB connection profile
          working-directory: integration_tests_duckdb
          run: dbt debug --profiles-dir .

        - name: Parse the minimal project using a DuckDB profile
          working-directory: integration_tests_duckdb
          run: dbt parse --profiles-dir .

  debug-databricks:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-python@v5
          with:
              python-version: "3.11"

        - name: Install dbt
          run: pip install "dbt>=2.0.0,<3.0.0"

        - name: Check the Databricks connection profile
          working-directory: integration_tests_duckdb
          run: dbt debug --profiles-dir . --target databricks
          env:
              DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
              DATABRICKS_HTTP_PATH: ${{ vars.DATABRICKS_HTTP_PATH }}
              DBT_ENV_SECRET_DATABRICKS_TOKEN: ${{ secrets.DBT_ENV_SECRET_DATABRICKS_TOKEN }}
